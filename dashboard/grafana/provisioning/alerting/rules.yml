apiVersion: 1

groups:
  - orgId: 1
    name: anomaly-detection
    folder: MQTT Telemetry Lab
    interval: 1m
    rules:
      - uid: anomaly-detected
        title: Machine anomaly detected
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: timescaledb
            model:
              # one row per machine -> one alert instance per machine (machine_id label)
              rawSql: "SELECT machine_id, count(*)::float AS anomaly_count FROM anomaly_scores(now() - interval '2 minutes', now()) WHERE is_anomaly GROUP BY machine_id"
              format: table
              editorMode: code
              rawQuery: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: B
        labels: {}
        annotations:
          summary: "Anomaly detected on {{ $labels.machine_id }}"
