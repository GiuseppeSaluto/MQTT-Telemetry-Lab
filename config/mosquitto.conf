# Local demo lab only: no auth/TLS on purpose, not exposed beyond the
# docker-compose network. Not representative of a production MQTT broker.
listener 1883
allow_anonymous true

# QoS 1 messages queued for the ingestion's persistent session while it's
# down (default 1000 = under 1 min at 36 machines, 18 msg/s): ~1.5 h here.
max_queued_messages 100000

# Sessions and queued messages survive a broker restart (volume in
# docker-compose.yml). Saved on shutdown and every 60 s; ponytail: a hard
# crash (SIGKILL, power loss) loses up to the last 60 s of changes.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Unacked QoS 1 messages sent to a client at once (the default, made explicit):
# the ingestion's request channel must be larger than this, see main.rs.
max_inflight_messages 20
