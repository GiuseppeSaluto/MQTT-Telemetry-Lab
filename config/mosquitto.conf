# Local demo lab only: no auth/TLS on purpose, not exposed beyond the
# docker-compose network. Not representative of a production MQTT broker.
listener 1883
allow_anonymous true

# QoS 1 messages queued for the ingestion's persistent session while it's
# down (default 1000 = under 1 min at 36 machines, 18 msg/s). ponytail: ~1.5 h
# here, kept in memory only, so a broker restart loses them; upgrade path is
# `persistence true` plus a volume for /mosquitto/data.
max_queued_messages 100000

# Unacked QoS 1 messages sent to a client at once (the default, made explicit):
# the ingestion's request channel must be larger than this, see main.rs.
max_inflight_messages 20
